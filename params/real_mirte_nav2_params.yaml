amcl:
  ros__parameters:
    robot_model_type: "nav2_amcl::OmniMotionModel"
    
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: scan
    tf_broadcast: true
    transform_tolerance: 1.0
    
    alpha1: 0.30 # how rotation affects the robot’s rotation estimate. Increasing this value increases uncertainty in the rotation estimation
    alpha2: 0.20 # how forward motion affects rotation estimates
    alpha3: 0.22 # how forward motion affects position estimates
    alpha4: 0.30 # how rotation affects position estimates
    alpha5: 0.35 # how omnidirectional movement affects position estimates
    
    # Skip obviously bad beams (dynamic occlusions) during motion
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    
    lambda_short: 0.1
    laser_max_range: 12.0
    laser_min_range: 0.30
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 3.0 # default 2.0
    
    max_beams: 90
    max_particles: 4000
    min_particles: 1000
    
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    save_pose_rate: 0.5
    sigma_hit: 0.2
    
    update_min_a: 0.05  # default 0.2
    update_min_d: 0.03  # default 0.25
    
    z_hit: 0.75 # Increase this value to trust more perfect matches with map (default 0.5)
    z_max: 0.05
    z_rand: 0.25 # decrease this value to assume sensor readings should match more with map (default 0.5)
    z_short: 0.05

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    use_sim_time: false
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
      acceleration_limit: 2.0
      deceleration_limit: -2.0
      minimum_speed: 0.5
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.5
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 2.0
    min_rotational_vel: 1.17
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /mirte_base_controller/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    #default_nav_to_pose_bt_xml: "<tree_path>"
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: false

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice" # In Iron and older versions, "/" was used instead of "::"
      allow_unknown: true                 # Allow traveling in unknown space
      tolerance: 0.25                     # dist-to-goal heuristic cost (distance) for valid tolerance endpoints if exact goal cannot be found.
      max_iterations: 1000000             # Maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000    # Maximum number of iterations after within tolerances to continue to try to find exact solution
      max_planning_time: 5.0              # Max time in s for planner to plan, smooth
      analytic_expansion_ratio: 2.5       # The ratio to attempt analytic expansions during search for final approach. (default: 3.5)
      analytic_expansion_max_length: 2.0  # For Hybrid/Lattice nodes The maximum length of the analytic expansion to be considered valid to prevent unsafe shortcutting (default: 3.0)
      analytic_expansion_max_cost: 200.0  # The maximum single cost for any part of an analytic expansion to contain and be valid, except when necessary on approach to goal
      analytic_expansion_max_cost_override: false  #  Whether or not to override the maximum cost setting if within critical distance to goal (ie probably required)
      reverse_penalty: 2.0                # Penalty to apply if motion is reversing, must be => 1
      change_penalty: 0.05                # Penalty to apply if motion is changing directions (L to R), must be >= 0
      non_straight_penalty: 1.05          # Penalty to apply if motion is non-straight, must be => 1
      cost_penalty: 2.0                   # Penalty to apply to higher cost areas when adding into the obstacle map dynamic programming distance expansion heuristic. This drives the robot more towards the center of passages. A value between 1.3 - 3.5 is reasonable.
      rotation_penalty: 5.0               # Penalty to apply to in-place rotations, if minimum control set contains them
      retrospective_penalty: 0.015
      lattice_filepath: "<lattice_config_path>"  # The filepath to the state lattice graph
      lookup_table_size: 20.0             # Size of the dubin/reeds-sheep distance window to cache, in meters.
      cache_obstacle_heuristic: false     # Cache the obstacle map dynamic programming distance expansion heuristic between subsequent replannings of the same goal location. Dramatically speeds up replanning performance (40x) if costmap is largely static.
      allow_reverse_expansion: false      # If true, allows the robot to use the primitives to expand in the mirrored opposite direction of the current robot's orientation (to reverse).
      coarse_search_resolution: 1         # Number of bins to skip when doing a coarse search for the path. Only used for all_direction goal heading mode.
      goal_heading_mode: "ALL_DIRECTION"  # DEFAULT, BIDIRECTIONAL, ALL_DIRECTION
      smooth_path: True                   # If true, does a simple and quick smoothing post-processing to the path
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /mirte_base_controller/odom
    controller_frequency: 20.0
    costmap_update_timeout: 0.50
    min_x_velocity_threshold:    0.26 # 0.26 is the min x vel it moves
    min_y_velocity_threshold:    0.37 # 0.37 is the min y vel it moves
    min_theta_velocity_threshold: 1.17 # 1.17 is the min ang vel it moves
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.5
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 30 # default 56 # current predictin horizon x: 36*0.05*1m/s=1.8m
      model_dt: 0.05
      batch_size: 2000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      vx_std: 0.10 # exploration in the x direction
      vy_std: 0.10 # exploration in the y direction
      wz_std: 0.20 # exploration in rotation
      vx_max: 1.0
      vx_min: -0.45
      vy_max: 0.5
      vy_min: -0.5
      wz_max: 2.0
      wz_min: -2.0
      iteration_count: 6 # default 1. trying to optmized path
      prune_distance: 0.8
      transform_tolerance: 0.35 # default 0.1
      temperature: 0.1
      gamma: 0.015
      motion_model: "Omni"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic", "VelocityDeadbandCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81 # default 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.25 # default 0.5
        trajectory_point_step: 2
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.25
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        threshold_to_consider: 0.8
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.8
        offset_from_furthest: 4
        use_path_orientations: true
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 6
        threshold_to_consider: 0.8
        max_angle_to_furthest: 0.8
        mode: 0
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 16.0
        offset_from_furthest: 4
        threshold_to_consider: 0.8
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 0.8
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 25.0
        deadband_velocities: [0.26, 0.37, 1.17]
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 45.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      global_frame: map
      robot_base_frame: base_link
      # robot_radius: 0.3
      footprint: "[ [-0.2275, -0.155], [0.1525, -0.155], [0.1525, 0.155], [-0.2275, 0.155] ]"
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: True
      plugins: ["static_layer", "obstacle_layer", "obstacle_layer_depth", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.3
          obstacle_max_range: 12.0
          obstacle_min_range: 0.3
      obstacle_layer_depth:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: "depth_camera"
        depth_camera:
          topic: /camera/depth/points
          max_obstacle_height: 0.65 # robot's height with arm up
          obstacle_max_range: 6.0 # this value needs to be checked in the camera datasheet
          obstacle_min_range: 0.2 # this value needs to be checked in the camera datasheet
          clearing: False
          marking: True
          data_type: "PointCloud2"
          # transport_type: "zstd" # not available in humble
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.8
        inflation_radius: 0.9
      

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0 # 5hz for both
      transform_tolerance: 0.3
      global_frame: odom 
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      always_send_full_costmap: True
      footprint: "[ [-0.2275, -0.155], [0.1525, -0.155], [0.1525, 0.155], [-0.2275, 0.155] ]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "obstacle_layer_depth", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: "scan"
        scan:
          topic: /scan
          max_obstacle_height: 0.65 # robot's height with arm up
          obstacle_max_range: 12.0
          obstacle_min_range: 0.3
          clearing: True
          marking: True
          data_type: "LaserScan"
      obstacle_layer_depth:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: "depth_camera"
        depth_camera:
          topic: /camera/depth/points
          max_obstacle_height: 0.65 # robot's height with arm up
          obstacle_max_range: 6.0 # this value needs to be checked in the camera datasheet
          obstacle_min_range: 0.2 # this value needs to be checked in the camera datasheet
          raytrace_max_range: 5.0 
          marking: True
          clearing: True
          observation_persistence: 5.0
          data_type: "PointCloud2"
          # transport_type: "zstd" # not available in humble
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.7
        inflation_radius: 0.6

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 10.0
    scale_velocities: True
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 1.0, 2.0]
    min_velocity: [-1.0, -1.0, -2.0]
    max_accel: [3.0, 3.0, 3.5] 
    max_decel: [-2.5, -2.0, -3.2]
    odom_topic: "/mirte_base_controller/odom"
    odom_duration: 0.1
    # deadband_velocity: [0.05, 0.05, 0.20]
    deadband_velocity: [0.22, 0.30, 1.17]
    velocity_timeout: 0.5

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided defaul>
    # To use in yaml, remove the default "map" value in the tb3_simulation_laun>
    yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200